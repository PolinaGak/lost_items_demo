version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lost_items_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lost_items_network
    env_file:
      - .env

  app:
    build: .
    container_name: lost_items_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT}:8000"
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      - API_HOST=${API_HOST}
      - API_PORT=${API_PORT}
      - SECRET_KEY=${SECRET_KEY}
      - VECTOR_DIMENSION=${VECTOR_DIMENSION}
    env_file:
      - .env
    volumes:
      - ./app:/app
    networks:
      - lost_items_network

volumes:
  postgres_data:
    name: lost_items_postgres_data

networks:
  lost_items_network:
    name: lost_items_network
    driver: bridge