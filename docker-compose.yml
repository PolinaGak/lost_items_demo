services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lost_items_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  bot:
    build: .
    container_name: lost_items_bot
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=db
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./app:/lost_items_demo/app
      - ./alembic:/lost_items_demo/alembic
      - ./alembic.ini:/lost_items_demo/alembic.ini
    command: sh -c "alembic upgrade head && python -m app.bot"

  api:
    build: .
    container_name: lost_items_api
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT}:8000"
    env_file:
      - .env
    volumes:
      - ./app:/lost_items_demo/app
      - ./alembic:/lost_items_demo/alembic
      - ./alembic.ini:/lost_items_demo/alembic.ini
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: